<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-2-01: 非インタラクティブ要素にクリックイベントを付与している（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.Button {
			display: inline-block;
			padding: 8px 20px;
			border-radius: 4px;
			background-color: #333;
			color: #fff;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<h1>2-2-01: 非インタラクティブ要素にクリックイベントを付与している（悪い例）</h1>

	<!--悪い例：非インタラクティブ要素にクリックイベントを付与している-->
	<script>
		const clickButton = (e) => { alert('追加しました'); }
	</script>
	<div role="button" class="Button" onclick="clickButton();"> 追加 </div>
</body>
</html>
