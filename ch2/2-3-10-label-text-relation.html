<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">

	<title>2-3-10: テキストを内包できない要素をlabel要素で関連付ける（良い例）</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>2-3-10: テキストを内包できない要素をlabel要素で関連付ける（良い例）</h1>

	<!-- 良い例：テキストを内包できない要素に label 要素を用いてテキストと関連付けする -->
	<label>
		検索
		<input type="text" />
	</label>
</body>
