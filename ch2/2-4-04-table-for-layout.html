<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-4-04: 段組みのためにtable要素を使用している（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		table {
			border-collapse: collapse;
		}

		td {
			vertical-align: top;
			padding: 8px 16px;
		}
	</style>
</head>
<body>
	<h1>2-4-04: 段組みのためにtable要素を使用している（悪い例）</h1>

	<!--悪い例：段組みのために table 要素を使用している-->
	<table>
		<tbody>
			<tr>
				<td>… メインとなるコンテンツ</td>
				<td>… サイドカラムのコンテンツ</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
