<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-3-14: alt属性が空のimg要素を装飾に用いる（良い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		button {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 8px 20px;
		}

		img {
			width: 16px;
			height: 16px;
		}
	</style>
</head>
<body>
	<h1>2-3-14: alt属性が空のimg要素を装飾に用いる（良い例）</h1>

	<!--良い例：alt属性が空のimg要素を装飾に用いる-->
	<button type="button">
		<img src="./assets/icon-add-dark.svg" alt="" />
		追加
	</button>
</body>
</html>
