<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-1-09: WAI-ARIAが優先されるロール（例）</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>2-1-09: WAI-ARIAが優先されるロール（例）</h1>

	<!--例：table 要素にスタイルとWAI-ARIA を付与-->
	<!-- 開発者ツールの Accessibility タブで、role="table" によって Role プロパティが table のままになっていることを確認できる -->
	<table style="display: contents" role="table">
		<tbody>
			<tr>
				<td>セル1</td>
				<td>セル2</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
