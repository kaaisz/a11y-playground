<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-4-01: 見出しにh1〜h6要素を用いていない（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* 悪い例：見出しにh1～h6要素を用いていない（CSS）*/
		.heading {
			font-weight: bold;
			line-height: 1.25;
		}

		.heading.-level3 {
			font-size: 1.5rem;
		}
	</style>
</head>
<body>
	<h1>2-4-01: 見出しにh1〜h6要素を用いていない（悪い例）</h1>

	<!--悪い例：見出しにh1～h6要素を用いていない（HTML）-->
	<div class="heading -level3">扶養家族情報の入力</div>
</body>
</html>
