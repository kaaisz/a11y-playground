<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-2-06: tabindex属性でフォーカスを受け取れるようにする（改善途中例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.Button {
			display: inline-block;
			padding: 8px 20px;
			border-radius: 4px;
			background-color: #333;
			color: #fff;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<h1>2-2-06: tabindex属性でフォーカスを受け取れるようにする（改善途中例）</h1>

	<!--改善途中例：tabindex 属性により div 要素でもフォーカスを受け取れる（HTML）-->
	<script>
		const clickButton = (e) => { alert('追加しました'); }
	</script>

	<div role="button" tabindex="0" class="Button" onclick="clickButton();"> 追加 </div>
</body>
</html>
