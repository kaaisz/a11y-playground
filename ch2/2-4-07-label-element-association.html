<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-4-07: ラベルと入力欄をlabel要素で関連づける（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		div {
			display: flex;
			gap: 1em;
		}

		label {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}
	</style>
</head>
<body>
	<h1>2-4-07: ラベルと入力欄をlabel要素で関連づける（改善例）</h1>

	<!--改善例：ラベルと入力欄をlabel要素で関連づける-->
	<div>
		<label>
			<span>姓</span>
			<input type="text">
		</label>
		<label>
			<span>名</span>
			<input type="text">
		</label>
	</div>
</body>
</html>
