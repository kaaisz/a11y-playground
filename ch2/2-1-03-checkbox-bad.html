<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-1-03: 状態が伝わらないチェックボックス（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* 悪い例：span 要素でオリジナルのチェックボックスを作って切り替える（CSS）*/
		.checkbox-wrapper {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			cursor: pointer;
		}

		.checkbox {
			display: inline-flex;
			height: calc(1em - 2px);
			width: calc(1em - 2px);
			border: 1px solid #999;
			border-radius: 4px;
		}

		.checkbox.-checked {
			background-color: #0077c7;
			background-image: url("assets/icon-check.svg");
			background-size: contain;
			border-color: #0077c7;
		}
	</style>
</head>
<body>
	<h1>2-1-03: 状態が伝わらないチェックボックス（悪い例）</h1>

	<!--悪い例：span 要素でオリジナルのチェックボックスを作って切り替える（HTML）-->
	<span class="checkbox-wrapper" onclick="toggleCheck();">
		<span class="checkbox -checked"></span>
		<span>同意する</span>
	</span>

	<script>
		function toggleCheck() {
			document.querySelector('.checkbox').classList.toggle('-checked');
		}
	</script>
</body>
</html>
