<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-1-07: WAI-ARIAで状態を補完したチェックボックス（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.checkbox-wrapper {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			cursor: pointer;
		}

		.checkbox {
			display: inline-flex;
			height: calc(1em - 2px);
			width: calc(1em - 2px);
			border: 1px solid #999;
			border-radius: 4px;
		}

		.checkbox.-checked {
			background-color: #0077c7;
			background-image: url("assets/icon-check.svg");
			background-size: contain;
			border-color: #0077c7;
		}
	</style>
</head>
<body>
	<h1>2-1-07: WAI-ARIAで状態を補完したチェックボックス（改善例）</h1>

	<!--改善例：aria-checked="true"-->
	<span class="checkbox-wrapper" onclick="toggleCheck();">
		<span
			role="checkbox"
			aria-checked="true"
			aria-labelledby="label"
			class="checkbox -checked"></span>
		<span id="label">同意する</span>
	</span>

	<script>
		function toggleCheck() {
			const checkbox = document.querySelector('[role="checkbox"]');
			const checked = checkbox.getAttribute('aria-checked') === 'true';
			checkbox.setAttribute('aria-checked', String(!checked));
			checkbox.classList.toggle('-checked', !checked);
		}
	</script>
</body>
</html>
