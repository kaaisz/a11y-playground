<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-2-07: キーボードイベントでEnter・Spaceキーに対応する（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.Button {
			display: inline-block;
			padding: 8px 20px;
			border-radius: 4px;
			background-color: #333;
			color: #fff;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<h1>2-2-07: キーボードイベントでEnter・Spaceキーに対応する（改善例）</h1>

	<!--改善例：非インタラクティブ要素にキーボードイベントを付与し、Enter キーとSpace キーで実行できる）-->
	<script>
		const clickButton = (e) => { alert('追加しました'); }
		const keyupButton = (e) => {
			if (e.key === 'Enter' || e.key === ' ') {
				clickButton(e);
			}
		}
	</script>

	<div role="button" tabindex="0" class="Button" onclick="clickButton();" onkeyup="keyupButton(event);">追加</div>
</body>
</html>
