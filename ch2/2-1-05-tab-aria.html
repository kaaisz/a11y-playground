<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-1-05: WAI-ARIAで補完したタブUI（良い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		[role="tablist"] {
			display: flex;
			gap: 4px;
			border-bottom: 1px solid #ccc;
		}

		[role="tab"] {
			padding: 8px 16px;
			border: none;
			border-bottom: 2px solid transparent;
			background: none;
			cursor: pointer;
		}

		[role="tab"][aria-selected="true"] {
			border-bottom-color: #0077c7;
			font-weight: bold;
		}

		[role="tabpanel"] {
			padding: 16px 0;
		}

		[role="tabpanel"][aria-hidden="true"] {
			display: none;
		}
	</style>
</head>
<body>
	<h1>2-1-05: WAI-ARIAで補完したタブUI（良い例）</h1>

	<!--良い例：タブUIのセマンティクスを WAI-ARIAで補完する-->
	<div role="tablist">
		<button role="tab" aria-selected="true" id="search-tab" aria-controls="search-panel">
			検索して追加
		</button>
		<button role="tab" aria-selected="false" tabindex="-1" id="file-tab" aria-controls="file-panel">
			ファイルから追加
		</button>
	</div>

	<div role="tabpanel" id="search-panel" aria-labelledby="search-tab" aria-hidden="false">
		⋯（省略）検索キーワードを入力してコンテンツを検索します。
	</div>

	<div role="tabpanel" id="file-panel" aria-labelledby="file-tab" aria-hidden="true">
		⋯（省略）ファイルをアップロードして追加します。
	</div>

	<script>
		const tabs = document.querySelectorAll('[role="tab"]');
		tabs.forEach((tab) => {
			tab.addEventListener('click', () => {
				tabs.forEach((t) => {
					t.setAttribute('aria-selected', 'false');
					t.setAttribute('tabindex', '-1');
					document.getElementById(t.getAttribute('aria-controls')).setAttribute('aria-hidden', 'true');
				});
				tab.setAttribute('aria-selected', 'true');
				tab.removeAttribute('tabindex');
				document.getElementById(tab.getAttribute('aria-controls')).setAttribute('aria-hidden', 'false');
			});
		});
	</script>
</body>
</html>
