<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-2-09: マウスとキーボードのイベントを併用する（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.VideoPlayer {
			position: relative;
			width: 320px;
			height: 180px;
			background-color: #000;
		}

		.VideoPlayer video {
			width: 100%;
			height: 100%;
		}

		/* 改善例：マウスイベントとキーボードイベントを併用する（CSS）*/
		.VideoPlayer__controls {
			display: none;
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
			padding: 8px;
			background-color: rgba(0, 0, 0, 0.6);
		}

		.VideoPlayer:hover > .VideoPlayer__controls,
		.VideoPlayer:focus-within > .VideoPlayer__controls {
			display: block;
		}

		.VideoPlayer__controls button {
			color: #fff;
			background: none;
			border: 1px solid #fff;
			border-radius: 4px;
			padding: 4px 10px;
		}
	</style>
</head>
<body>
	<h1>2-2-09: マウスとキーボードのイベントを併用する（改善例）</h1>

	<!--改善例：マウスイベントとキーボードイベントを併用する（HTML）-->
	<div class="VideoPlayer" tabindex="0">
		<video src="/movie/sample.mp4"></video>
		<div class="VideoPlayer__controls" role="group">
			<button type="button">一時停止</button>
			<button type="button">再生</button>
		</div>
	</div>
</body>
</html>
