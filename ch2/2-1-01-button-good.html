<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-1-01: 名前と役割があるボタン（良い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.Button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 48px;
			height: 48px;
			padding: 0;
			border: none;
			border-radius: 50%;
			background-color: #333;
			cursor: pointer;
		}

		.Button img {
			width: 20px;
			height: 20px;
		}
	</style>
</head>
<body>
	<h1>2-1-01: 名前と役割があるボタン（良い例）</h1>

	<!--（良い例：スクリーンリーダーで読み上げられる-->
	<button class="Button" onclick="alert('追加しました')">
		<img src="assets/icon-add.svg" alt="追加" />
	</button>
</body>
</html>
