<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-4-09: key-value形式の情報をdl要素でグルーピングする（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		dl {
			display: flex;
			gap: 24px;
			margin: 0;
		}

		dl > div {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		dt {
			color: #888;
		}

		dd {
			margin: 0;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<h1>2-4-09: key-value形式の情報をdl要素でグルーピングする（改善例）</h1>

	<!--改善例：key-value 形式の情報をdl要素でグルーピングする-->
	<dl>
		<div>
			<dt>完了</dt>
			<dd>123件</dd>
		</div>
		<div>
			<dt>進行中</dt>
			<dd>28件</dd>
		</div>
		<div>
			<dt>エラー</dt>
			<dd>3件</dd>
		</div>
	</dl>
</body>
</html>
