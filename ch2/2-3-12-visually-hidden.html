<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-3-12: Visually Hiddenでテキストデータを付与する（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		button {
			display: inline-flex;
			align-items: center;
			padding: 8px;
		}

		svg {
			width: 24px;
			height: 24px;
			fill: #333;
		}

		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			clip-path: inset(100%);
			overflow: hidden;
		}
	</style>
</head>
<body>
	<h1>2-3-12: Visually Hiddenでテキストデータを付与する（改善例）</h1>

	<!--（改善例：Visually Hidden を用いてボタンにテキストデータを付与する）-->
	<button type="button">
		<svg aria-hidden="true" viewBox="0 0 448 512"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/></svg>
		<span class="visually-hidden">追加</span>
	</button>
</body>
</html>
