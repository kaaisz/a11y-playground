<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>2-2-02: フォーカス可能な要素をdisplay:noneで非表示にしている（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		label {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			cursor: pointer;
		}

		.Checkbox__wrapper {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 18px;
			height: 18px;
			border: 1px solid #999;
			border-radius: 4px;
		}

		/*悪い例：フォーカス可能な要素を display: none で非表示にしている（CSS）*/
		input {
			display: none;
		}

		input:not(:checked) ~ .Checkbox__wrapper > svg {
			display: none;
		}
	</style>
</head>
<body>
	<h1>2-2-02: フォーカス可能な要素をdisplay:noneで非表示にしている（悪い例）</h1>

	<!--悪い例：フォーカス可能な要素を display: none で非表示にしている (HTML)-->
	<label>
		<input type="checkbox" checked />
		<span class="Checkbox__wrapper">
			<svg viewBox="0 0 512 512" width="14">
				<path fill="#0770c7" d="M470.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L192 338.7 425.4 105.4c12.5-12.5 32.8-12.5 45.3 0z" />
			</svg>
		</span>
		同意する
	</label>
</body>
</html>
