<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<!--改善例：ブラウザのズーム機能を禁止しない（maximum-scale・user-scalable を指定しない）-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-2-02: ブラウザのズーム機能を禁止しない（改善例）</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>4-2-02: ブラウザのズーム機能を禁止しない（改善例）</h1>

	<p>
		viewportに <code>user-scalable</code> や <code>maximum-scale</code> を指定していないため、
		タッチデバイスでピンチアウトによる画面拡大ができます。
		実機またはモバイルエミュレーションで確認してください。
	</p>
</body>
</html>
