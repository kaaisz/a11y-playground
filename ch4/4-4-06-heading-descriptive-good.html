	<title>4-4-06: 見出しのみを取り出してページの概要が理解できるようにする（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		article {
			max-width: 480px;
		}

		h2 {
			font-size: 1rem;
			margin-top: 24px;
		}
	</style>
</head>
<body>
	<h1>4-4-06: 見出しのみを取り出してページの概要が理解できるようにする（改善例）</h1>

	<!--改善例：見出しだけを拾い読みしてもページの概要がわかる文言にしている-->
	<article>
		<h2>ラベルと説明を関連付ける</h2>
		<p>Webアクセシビリティに配慮したフォームの入力欄には、ラベルと説明を適切に関連付ける必要があります。</p>

		<h2>入力必須をテキストで伝える</h2>
		<p>フォームコントロールが入力必須かどうかは、色だけでなくテキストでも伝える必要があります。</p>

		<h2>エラー箇所をマークアップする</h2>
		<p>エラーが発生した箇所は、支援技術のユーザーにもわかるようにマークアップする必要があります。</p>
	</article>
