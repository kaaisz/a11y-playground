<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-3-02: 行を適切な長さに抑える（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* 良い例：行の最大幅をおおよそ全角40文字分に設定する（chは半角文字基準のため2倍にする） */
		p {
			max-width: 80ch;
		}
	</style>
</head>
<body>
	<h1>4-3-02: 行を適切な長さに抑える（改善例）</h1>

	<p>
		アクセシビリティにおいてテキストレイアウトは重要な役割を持ちます。適切なテキストレイアウトにすることで、テキストを読む速度が速くなる、テキストの読み間違いが少なくなる、テキストを理解しやすくなるといった効果が期待できます。行が長すぎると、多くのユーザーにとってテキストが読みにくくなります。今自分が読んでいる位置を把握したり、次の行へ読み進めることが難しくなります。また、画面の拡大が必要なロービジョンのユーザーは、拡大した画面の横幅に行がおさまらないことがあります。
	</p>
</body>
</html>
