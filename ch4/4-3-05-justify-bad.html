<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-3-05: テキストが両端揃えされている（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* 悪い例：両端揃えによって単語間の間隔が行ごとに不揃いになる */
		p {
			max-width: 40ch;
			line-height: 1.5;
			text-align: justify;
		}
	</style>
</head>
<body>
	<h1>4-3-05: テキストが両端揃えされている（悪い例）</h1>

	<p>
		テキストが両端揃えされていると、単語間の間隔が状況によって変化してしまいテキストが読みにくくなります。単語間の間隔がまちまちの場合、行どうしの空白部分が結び付き白い「川」のように見えてしまうことがあります。特定の認知障害のあるユーザーは川に気を取られ、テキストが読めなくなってしまうことがあります。
	</p>
</body>
</html>
