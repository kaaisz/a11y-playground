<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<!--悪い例：ピンチアウトによる画面の拡大を禁止している-->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>4-2-01: ピンチアウトによる画面の拡大を禁止している（悪い例）</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>4-2-01: ピンチアウトによる画面の拡大を禁止している（悪い例）</h1>

	<p>
		<code>&lt;meta name="viewport" content="user-scalable=no"&gt;</code> が指定されているため、
		タッチデバイス（スマートフォン・タブレット）ではピンチアウトによる画面拡大ができません。
		実機またはモバイルエミュレーションで確認してください。
	</p>
</body>
</html>
