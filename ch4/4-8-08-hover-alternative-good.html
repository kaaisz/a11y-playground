<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-8-08: モバイルデバイスでも操作できる代替手段を設ける（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.menu {
			position: relative;
			display: inline-block;
		}

		.submenu {
			position: absolute;
			top: 100%;
			left: 0;
			background: #ddd;
			padding: 8px;
			list-style: none;
			margin: 0;
		}

		.submenu[hidden] {
			display: none;
		}

		button {
			padding: 8px 16px;
		}
	</style>
</head>
<body>
	<h1>4-8-08: モバイルデバイスでも操作できる代替手段を設ける（改善例）</h1>

	<!--改善例：マウスオーバーではなく、クリック／タップで開閉するボタンにする
		タッチデバイス・キーボードのどちらでも操作できる-->
	<div class="menu">
		<button type="button" id="toggle" aria-expanded="false" aria-controls="submenu">商品カテゴリ</button>
		<ul class="submenu" id="submenu" hidden>
			<li>家電</li>
			<li>書籍</li>
			<li>食品</li>
		</ul>
	</div>

	<script>
		const toggle = document.getElementById('toggle');
		const submenu = document.getElementById('submenu');
		toggle.addEventListener('click', () => {
			const expanded = toggle.getAttribute('aria-expanded') === 'true';
			toggle.setAttribute('aria-expanded', String(!expanded));
			submenu.hidden = expanded;
		});
	</script>
</body>
</html>
