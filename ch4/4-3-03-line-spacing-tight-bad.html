<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-3-03: 行の間隔や段落の間隔が狭い（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* 悪い例：行送りが詰まっており、段落の間隔も行送りと変わらない */
		p {
			max-width: 80ch;
			line-height: 1;
			margin: 0.2em 0;
		}
	</style>
</head>
<body>
	<h1>4-3-03: 行の間隔や段落の間隔が狭い（悪い例）</h1>

	<p>
		行の間隔が狭すぎることも多くのユーザーにとってテキストを読みにくくします。行の間隔が狭いと、今読んでいる行に別の行が被って見えてしまったり、同じ行を何度も読み進めてしまったりします。
	</p>
	<p>
		段落の間隔が行の間隔に比べて狭い場合は、段落ごとのまとまりを認識することが難しくなります。人によっては段落の先頭だけを読んで文章の概要を把握することがあります。
	</p>
</body>
</html>
