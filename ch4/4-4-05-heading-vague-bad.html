<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-4-05: 見出しがページの概要を表していない（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		article {
			max-width: 480px;
		}

		h2 {
			font-size: 1rem;
			margin-top: 24px;
		}
	</style>
</head>
<body>
	<h1>4-4-05: 見出しがページの概要を表していない（悪い例）</h1>

	<!--悪い例：見出しが「その1」「その2」「その3」となっており、見出しだけを取り出しても
		ページの概要が理解できない-->
	<article>
		<h2>その1</h2>
		<p>Webアクセシビリティに配慮したフォームの入力欄には、ラベルと説明を適切に関連付ける必要があります。</p>

		<h2>その2</h2>
		<p>フォームコントロールが入力必須かどうかは、色だけでなくテキストでも伝える必要があります。</p>

		<h2>その3</h2>
		<p>エラーが発生した箇所は、支援技術のユーザーにもわかるようにマークアップする必要があります。</p>
	</article>
</body>
</html>
