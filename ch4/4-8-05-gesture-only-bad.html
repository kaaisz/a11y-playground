<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-8-05: ジェスチャのみに依存している（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.viewer {
			width: 240px;
			height: 140px;
			background: #ddd;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.2rem;
			touch-action: pan-y;
			user-select: none;
		}

		.status {
			margin-top: 12px;
			color: #666;
		}
	</style>
</head>
<body>
	<h1>4-8-05: ジェスチャのみに依存している（悪い例）</h1>

	<!--悪い例：スワイプ（フリック）でしか画像を切り替えられない
		代替のボタンがなく、正確な軌跡を描けないユーザーや外付けキーボードのユーザーは操作できない-->
	<div class="viewer" id="viewer">1 / 3</div>
	<p class="status">左右にスワイプしてください（ボタンでの操作手段はありません）</p>

	<script>
		const viewer = document.getElementById('viewer');
		const total = 3;
		let index = 1;
		let startX = 0;

		viewer.addEventListener('touchstart', (e) => {
			startX = e.touches[0].clientX;
		});

		viewer.addEventListener('touchend', (e) => {
			const deltaX = e.changedTouches[0].clientX - startX;
			if (Math.abs(deltaX) < 30) return;
			index = deltaX < 0 ? Math.min(index + 1, total) : Math.max(index - 1, 1);
			viewer.textContent = `${index} / ${total}`;
		});
	</script>
</body>
</html>
