<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-2-05: フォントサイズがブラウザの文字サイズ変更機能に反映されない（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* 悪い例：フォントサイズを絶対単位（px）で指定している */
		.save-button {
			font-size: 16px;
			min-width: 80px;
			height: 32px;
		}
	</style>
</head>
<body>
	<h1>4-2-05: フォントサイズがブラウザの文字サイズ変更機能に反映されない（悪い例）</h1>

	<button type="button" class="save-button">保存</button>

	<p>
		下のボタンでブラウザの「標準フォントサイズ」を変更した想定を再現します（<code>html</code>要素の
		<code>font-size</code> を書き換えます）。上のボタンは<code>px</code>指定のため、大きさが変化しません。
	</p>
	<button type="button" id="simulate">標準フォントサイズを32pxに変更した想定で再描画</button>

	<script>
		document.getElementById('simulate').addEventListener('click', () => {
			document.documentElement.style.fontSize = '32px';
		});
	</script>
</body>
</html>
