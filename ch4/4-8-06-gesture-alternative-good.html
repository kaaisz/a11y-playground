<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-8-06: ジェスチャの代替手段を設ける（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.viewer-wrap {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.viewer {
			width: 240px;
			height: 140px;
			background: #ddd;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.2rem;
			touch-action: pan-y;
			user-select: none;
		}

		button {
			width: 44px;
			height: 44px;
		}
	</style>
</head>
<body>
	<h1>4-8-06: ジェスチャの代替手段を設ける（改善例）</h1>

	<!--改善例：スワイプに加えて、1本指のタップで操作できる「前へ」「次へ」ボタンを設ける
		ジェスチャを使えないユーザーもボタンで同じ操作ができ、キーボードでも操作できる-->
	<div class="viewer-wrap">
		<button type="button" id="prev" aria-label="前の画像へ">◀</button>
		<div class="viewer" id="viewer">1 / 3</div>
		<button type="button" id="next" aria-label="次の画像へ">▶</button>
	</div>

	<script>
		const viewer = document.getElementById('viewer');
		const total = 3;
		let index = 1;
		let startX = 0;

		const update = () => {
			viewer.textContent = `${index} / ${total}`;
		};

		document.getElementById('prev').addEventListener('click', () => {
			index = Math.max(index - 1, 1);
			update();
		});

		document.getElementById('next').addEventListener('click', () => {
			index = Math.min(index + 1, total);
			update();
		});

		viewer.addEventListener('touchstart', (e) => {
			startX = e.touches[0].clientX;
		});

		viewer.addEventListener('touchend', (e) => {
			const deltaX = e.changedTouches[0].clientX - startX;
			if (Math.abs(deltaX) < 30) return;
			index = deltaX < 0 ? Math.min(index + 1, total) : Math.max(index - 1, 1);
			update();
		});
	</script>
</body>
</html>
