<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-9-10: パンくずリストとaria-current属性で現在位置を示す（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		nav ul {
			list-style: none;
			display: flex;
			gap: 16px;
			padding: 0;
		}

		nav a {
			color: #06c;
		}

		/* 良い例：現在のページを太字にし、視覚的にも強調する */
		nav a[aria-current="page"] {
			color: inherit;
			font-weight: bold;
			text-decoration: none;
		}

		.breadcrumb ol {
			list-style: none;
			display: flex;
			gap: 4px;
			padding: 0;
			font-size: 0.9rem;
			color: #666;
		}

		.breadcrumb li:not(:last-child)::after {
			content: "›";
			margin-left: 4px;
		}
	</style>
</head>
<body>
	<h1>4-9-10: パンくずリストとaria-current属性で現在位置を示す（改善例）</h1>

	<!--良い例：ナビゲーションの現在の項目に aria-current="page" を付ける-->
	<nav aria-label="グローバルナビゲーション">
		<ul>
			<li><a href="#">ホーム</a></li>
			<li><a href="#" aria-current="page">商品一覧</a></li>
			<li><a href="#">書籍</a></li>
			<li><a href="#">お問い合わせ</a></li>
		</ul>
	</nav>

	<!--良い例：パンくずリストでサイト内の階層を示す-->
	<nav class="breadcrumb" aria-label="パンくずリスト">
		<ol>
			<li><a href="#">ホーム</a></li>
			<li><a href="#">商品一覧</a></li>
			<li><a href="#" aria-current="page">Webアプリケーションアクセシビリティ</a></li>
		</ol>
	</nav>

	<h2>Webアプリケーションアクセシビリティ</h2>
	<p>この本の詳細ページです。パンくずリストとナビゲーションの強調表示により、現在位置がわかります。</p>
</body>
</html>
