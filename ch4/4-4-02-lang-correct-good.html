<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>4-4-02: lang属性に適切な言語を指定する（改善例）</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!--改善例：日本語で書かれたページの言語に日本語を指定する（html lang="ja"）-->
	<h1>4-4-02: lang属性に適切な言語を指定する（改善例）</h1>

	<p>
		このページは日本語で書かれており、<code>&lt;html lang="ja"&gt;</code> が正しく指定されています。
		スクリーンリーダーは正しい発音で日本語のテキストを読み上げられます。
	</p>
</body>
</html>
