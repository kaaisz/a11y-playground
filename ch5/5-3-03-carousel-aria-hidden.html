<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-3-03: はみ出た画像をaria-hiddenで非表示にする（良い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* overflow: hidden でアニメーションしながら領域外へ移動する画像を表現する構成の例 */
		.Carousel {
			width: 160px;
			overflow: hidden;
		}

		ul {
			display: flex;
			list-style: none;
			margin: 0;
			padding: 0;
			/* 3枚目（インデックス2）が見えるようにリスト全体をずらす */
			transform: translateX(-320px);
		}

		li {
			flex: 0 0 160px;
		}

		img {
			width: 160px;
			height: 100px;
			background: #ccc;
			border-radius: 4px;
			display: block;
			object-fit: cover;
		}
	</style>
</head>
<body>
	<h1>5-3-03: はみ出た画像をaria-hiddenで非表示にする（良い例）</h1>

	<!-- 良い例：はみ出た画像を非表示にする（aria-hidden="true"と tabindex="-1"を使った場合）-->
	<div class="Carousel">
		<ul>
			<li aria-hidden="true">
				<a href="#" tabindex="-1">
					<img src="https://picsum.photos/id/1015/320/200" alt="断崖の上から見下ろす、山に囲まれた青いフィヨルド">
				</a>
			</li>
			<li aria-hidden="true">
				<a href="#" tabindex="-1">
					<img src="https://picsum.photos/id/1025/320/200" alt="タータンチェックの毛布にくるまれ、森の小道に座るパグ">
				</a>
			</li>
			<li>
				<a href="#">
					<!-- 現在表示されている画像 -->
					<img src="https://picsum.photos/id/1035/320/200" alt="虹のかかる滝の前で両手を広げる人">
				</a>
			</li>
			<li aria-hidden="true">
				<a href="#" tabindex="-1">
					<img src="https://picsum.photos/id/1043/320/200" alt="針葉樹と切り立った岩山に囲まれた渓流">
				</a>
			</li>
			<li aria-hidden="true">
				<a href="#" tabindex="-1">
					<img src="https://picsum.photos/id/1050/320/200" alt="海食崖と岩の柱が連なる海岸線">
				</a>
			</li>
		</ul>
	</div>
</body>
</html>
