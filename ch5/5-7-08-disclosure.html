<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-7-08: summary要素とdetails要素によるディスクロージャー（例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		details {
			border: 1px solid #949494;
			border-radius: 4px;
			padding: 8px 12px;
			max-width: 320px;
		}

		summary {
			cursor: pointer;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<h1>5-7-08: summary要素とdetails要素によるディスクロージャー（例）</h1>

	<!--例：summary要素と details 要素によるディスクロージャー-->
	<details>
		<summary>配送について</summary>
		ご注文から3〜5営業日以内に発送いたします。離島・一部地域は追加で日数がかかる場合があります。
	</details>
</body>
</html>
