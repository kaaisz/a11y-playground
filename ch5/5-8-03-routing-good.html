<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-8-03: アナウンサー要素へのフォーカス移動も行うクライアントサイドルーティング（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			clip-path: inset(100%);
			overflow: hidden;
		}

		nav a {
			margin-right: 16px;
		}

		main {
			margin-top: 16px;
		}
	</style>
</head>
<body>
	<h1>5-8-03: アナウンサー要素へのフォーカス移動も行うクライアントサイドルーティング（改善例）</h1>
	<div id="root"></div>

	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

	<script type="text/babel-tsx" id="app-source">
		const { useState, useEffect, useRef } = React;

		const routes = {
			'/': { title: 'ホーム | サンプルサイト', heading: 'ホーム', body: 'これはトップページのコンテンツです。' },
			'/list': { title: '商品一覧 | サンプルサイト', heading: '商品一覧', body: '商品の一覧を表示するページです。' },
			'/contact': { title: 'お問い合わせ | サンプルサイト', heading: 'お問い合わせ', body: 'お問い合わせフォームのページです。' },
		};

		const getPath = () => {
			const hash = location.hash.replace(/^#/, '');
			return routes[hash] ? hash : '/';
		};

		// 改善方法：アナウンサー要素は title 要素の代替として設置しているため Tab キーでの到達は不要。
		// tabindex="-1" を付与して programmatic focus のみを許可し、ナビゲーション終了後にフォーカスをあてることで
		// Tab フォーカスの開始位置を擬似的にページの先頭に戻す
		const App = () => {
			const [path, setPath] = useState(getPath());
			const isFirstRender = useRef(true);

			useEffect(() => {
				const onHashChange = () => setPath(getPath());
				window.addEventListener('hashchange', onHashChange);
				return () => window.removeEventListener('hashchange', onHashChange);
			}, []);

			useEffect(() => {
				document.title = routes[path].title;

				if (isFirstRender.current) {
					isFirstRender.current = false;
					return;
				}

				// 良い例：ナビゲーション終了後にタイトルの通知とアナウンサー要素へのフォーカスをあてる
				const announcer = document.getElementById('announcer');
				if (announcer instanceof HTMLElement) {
					announcer.textContent = document.title;
					announcer.focus();
				}
			}, [path]);

			const route = routes[path];

			return (
				<>
					<p id="announcer" tabIndex={-1} role="alert" aria-live="assertive" className="visually-hidden"></p>
					<nav aria-label="サンプルサイト">
						<a href="#/">ホーム</a>
						<a href="#/list">商品一覧</a>
						<a href="#/contact">お問い合わせ</a>
					</nav>
					<main>
						<h2>{route.heading}</h2>
						<p>{route.body}</p>
					</main>
				</>
			);
		};

		ReactDOM.createRoot(document.getElementById('root')).render(<App />);
	</script>
	<script>
		const source = document.getElementById('app-source').textContent;
		const { code } = Babel.transform(source, {
			presets: [['react', { runtime: 'classic' }], 'typescript'],
			filename: 'app.tsx',
		});
		const script = document.createElement('script');
		script.textContent = code;
		document.body.appendChild(script);
	</script>
</body>
</html>
