<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-7-01: アクセシビリティを考慮しないハンバーガーメニュー（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.hamburgermenu {
			overflow: hidden;
			transition: width 0.5s;
			display: flex;
			flex-direction: column;
			background: #ccc;
			white-space: nowrap;
		}

		.hamburgermenu:not(.expanded) {
			width: 0;
		}

		.hamburgermenu.expanded {
			width: 200px;
		}

		.hamburgermenu a {
			padding: 8px 16px;
			color: #111;
		}

		.iconTrigger {
			display: inline-block;
			padding: 8px;
			cursor: pointer;
		}

		svg {
			fill: #333;
		}
	</style>
</head>
<body>
	<h1>5-7-01: アクセシビリティを考慮しないハンバーガーメニュー（悪い例）</h1>
	<div id="root"></div>

	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

	<script type="text/babel-tsx" id="app-source">
		const { useState } = React;

		// 悪い例：アクセシビリティを考慮せず作られたハンバーガーメニュー
		// ※ styled-components の代わりに style タグでスタイルを定義している
		const HamburgerMenu = () => {
			// 開閉状態を管理するステート
			const [isExpanded, setExpanded] = useState(false);

			const handleClick = () => {
				// クリックしたときに開閉状態を切り替える
				setExpanded(!isExpanded);
			};

			return (
				<div>
					<div className="iconTrigger" onClick={handleClick}>
						<svg viewBox="0 0 448 512" width="24" height="24">
							<path d="M0 96C0 78.3 14.3 64 32 64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z" />
						</svg>
					</div>
					<nav className={`hamburgermenu${isExpanded ? ' expanded' : ''}`}>
						<a href="#">ホーム</a>
						<a href="#">商品一覧</a>
						<a href="#">お問い合わせ</a>
					</nav>
				</div>
			);
		};

		ReactDOM.createRoot(document.getElementById('root')).render(<HamburgerMenu />);
	</script>
	<script>
		const source = document.getElementById('app-source').textContent;
		const { code } = Babel.transform(source, {
			presets: [['react', { runtime: 'classic' }], 'typescript'],
			filename: 'app.tsx',
		});
		const script = document.createElement('script');
		script.textContent = code;
		document.body.appendChild(script);
	</script>
</body>
</html>
