<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-2-02: aria-live属性の要素を挿入するだけ（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.notification {
			margin-top: 12px;
			padding: 8px 12px;
			background: #eef;
			color: #111;
			border-radius: 4px;
			display: inline-block;
		}
	</style>
</head>
<body>
	<h1>5-2-02: aria-live属性の要素を挿入するだけ（悪い例）</h1>
	<div id="root"></div>

	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

	<script type="text/babel-tsx" id="app-source">
		const { useState } = React;

		// 悪い例：aria-live 属性の付いた要素を挿入するだけのコンポーネント
		const Notification = ({ message }: { message: string }) => {
			return (
				<div className="notification" aria-live="polite" aria-atomic="true">
					{message}
				</div>
			);
		};

		// 悪い例：上記コンポーネントの使用例
		const App = () => {
			const [processHasDone, setProcessHasDone] = useState(false);

			return (
				<>
					<button onClick={() => setProcessHasDone(true)}>処理を実行</button>
					{processHasDone && <Notification message="処理が完了しました" />}
				</>
			);
		};

		ReactDOM.createRoot(document.getElementById('root')).render(<App />);
	</script>
	<script>
		const source = document.getElementById('app-source').textContent;
		const { code } = Babel.transform(source, {
			presets: [['react', { runtime: 'classic' }], 'typescript'],
			filename: 'app.tsx',
		});
		const script = document.createElement('script');
		script.textContent = code;
		document.body.appendChild(script);
	</script>
</body>
</html>
