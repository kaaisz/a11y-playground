<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-7-06: それぞれのナビゲーションに名前を付けた例（良い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		nav {
			margin-bottom: 16px;
		}

		nav a {
			margin-right: 12px;
		}
	</style>
</head>
<body>
	<h1>5-7-06: それぞれのナビゲーションに名前を付けた例（良い例）</h1>

	<!--（良い例：それぞれのナビゲーションに名前を付けた例-->
	<nav aria-label="メインメニュー">
		<!--ハンバーガーメニュー-->
		<a href="#">ホーム</a>
		<a href="#">商品一覧</a>
		<a href="#">お問い合わせ</a>
	</nav>
	<nav aria-label="サブメニュー">
		<!--ハンバーガーメニュー以外-->
		<a href="#">利用規約</a>
		<a href="#">プライバシーポリシー</a>
	</nav>
</body>
</html>
