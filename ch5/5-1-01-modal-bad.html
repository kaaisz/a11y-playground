<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-1-01: アクセシビリティを考慮しないモーダルダイアログ（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/*悪い例：アクセシビリティを考慮せず作られたモーダルダイアログのコンポーネント（CSS）*/
		.screen {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, .4);
			z-index: 1000;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.dialog {
			background: #fff;
			color: #111;
			padding: 2rem;
			border-radius: 8px;
		}
	</style>
</head>
<body>
	<h1>5-1-01: アクセシビリティを考慮しないモーダルダイアログ（悪い例）</h1>
	<div id="root"></div>

	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

	<script type="text/babel-tsx" id="app-source">
		const { useEffect, useState, useRef } = React;
		const { createPortal } = ReactDOM;

		// 悪い例：アクセシビリティを考慮せず作られたモーダルダイアログのコンポーネント（TypeScript）
		const ModalSampleBad = () => {
			// モーダルダイアログの開閉状態を保持する state
			const [isOpen, setOpen] = useState(false);
			// body 直下に差し込んだ要素を参照するための RefObject
			const modalElm = useRef<HTMLDivElement | null>(null);

			useEffect(() => {
				// コンポーネントが mount されたときの処理
				// body 直下にモーダルダイアログを差し込むための要素を作成
				const el = document.createElement('div');
				document.body.appendChild(el);
				modalElm.current = el;
				return () => {
					// コンポーネントが unmount されるとき、body 直下に差し込んだ要素も削除する
					document.body.removeChild(el);
				};
			}, []);

			return (
				<>
					<ul>
						<li>
							<button onClick={() => setOpen(true)}>ダイアログを開く</button>
						</li>
						<li>
							<a href="https://gihyo.jp">技術評論社のWebサイト</a>
						</li>
					</ul>
					{isOpen && modalElm.current && createPortal(
						<div className="screen">
							<div className="dialog">
								<h1>モーダルダイアログ</h1>
								<p>この部分がモーダルダイアログです</p>
								<button onClick={() => setOpen(false)}>
									ダイアログを閉じる
								</button>
							</div>
						</div>,
						modalElm.current
					)}
				</>
			);
		};

		ReactDOM.createRoot(document.getElementById('root')).render(<ModalSampleBad />);
	</script>
	<script>
		// Babel standalone のスクリプトタグ自動処理はデフォルトで automatic JSX runtime
		// (import 文を生成) を使うため、type="module" を持たないページでは動かない。
		// そのため classic runtime を明示して手動でトランスパイル・実行する。
		const source = document.getElementById('app-source').textContent;
		const { code } = Babel.transform(source, {
			presets: [['react', { runtime: 'classic' }], 'typescript'],
			filename: 'app.tsx',
		});
		const script = document.createElement('script');
		script.textContent = code;
		document.body.appendChild(script);
	</script>
</body>
</html>
