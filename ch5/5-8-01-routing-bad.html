<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-8-01: ページタイトルの通知とフォーカスの復帰を行わないクライアントサイドルーティング（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		nav a {
			margin-right: 16px;
		}

		main {
			margin-top: 16px;
		}
	</style>
</head>
<body>
	<h1>5-8-01: ページタイトルの通知とフォーカスの復帰を行わないクライアントサイドルーティング（悪い例）</h1>
	<div id="root"></div>

	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

	<script type="text/babel-tsx" id="app-source">
		const { useState, useEffect } = React;

		// 疑似的なページ内容。クライアントサイドルーティングで DOM ツリーの一部を差し替える
		const routes = {
			'/': { title: 'ホーム | サンプルサイト', heading: 'ホーム', body: 'これはトップページのコンテンツです。' },
			'/list': { title: '商品一覧 | サンプルサイト', heading: '商品一覧', body: '商品の一覧を表示するページです。' },
			'/contact': { title: 'お問い合わせ | サンプルサイト', heading: 'お問い合わせ', body: 'お問い合わせフォームのページです。' },
		};

		const getPath = () => {
			const hash = location.hash.replace(/^#/, '');
			return routes[hash] ? hash : '/';
		};

		// 悪い例：title 要素の内容を書き換えるだけでは支援技術には通知されない。
		// またフォーカスの位置もクリックしたリンクのまま変わらず、ページの先頭に戻らない
		const App = () => {
			const [path, setPath] = useState(getPath());

			useEffect(() => {
				const onHashChange = () => setPath(getPath());
				window.addEventListener('hashchange', onHashChange);
				return () => window.removeEventListener('hashchange', onHashChange);
			}, []);

			useEffect(() => {
				document.title = routes[path].title;
			}, [path]);

			const route = routes[path];

			return (
				<>
					<nav aria-label="サンプルサイト">
						<a href="#/">ホーム</a>
						<a href="#/list">商品一覧</a>
						<a href="#/contact">お問い合わせ</a>
					</nav>
					<main>
						<h2>{route.heading}</h2>
						<p>{route.body}</p>
					</main>
				</>
			);
		};

		ReactDOM.createRoot(document.getElementById('root')).render(<App />);
	</script>
	<script>
		const source = document.getElementById('app-source').textContent;
		const { code } = Babel.transform(source, {
			presets: [['react', { runtime: 'classic' }], 'typescript'],
			filename: 'app.tsx',
		});
		const script = document.createElement('script');
		script.textContent = code;
		document.body.appendChild(script);
	</script>
</body>
</html>
