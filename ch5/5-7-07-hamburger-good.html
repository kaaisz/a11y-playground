<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-7-07: ここまでの内容をすべて反映したハンバーガーメニュー（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		button {
			border: 0;
			background: transparent;
			padding: 8px;
			cursor: pointer;
		}

		svg {
			fill: #333;
		}

		.hamburgermenu {
			overflow: hidden;
			transition: width 0.5s;
			display: flex;
			flex-direction: column;
			background: #ccc;
			white-space: nowrap;
		}

		.hamburgermenu:not(.expanded) {
			width: 0;
		}

		.hamburgermenu.expanded {
			width: 200px;
		}

		/* [hidden] は UA スタイルシートでの display:none だが、
		   .hamburgermenu の display:flex と詳細度が同じため、
		   確実に隠れるよう明示的に上書きしておく */
		.hamburgermenu[hidden] {
			display: none;
		}

		.hamburgermenu a {
			padding: 8px 16px;
			color: #111;
		}
	</style>
</head>
<body>
	<h1>5-7-07: ここまでの内容をすべて反映したハンバーガーメニュー（改善例）</h1>
	<div id="root"></div>

	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

	<script type="text/babel-tsx" id="app-source">
		const { useState } = React;

		// 改善例：ここまでの内容をすべて反映したハンバーガーメニューの実装
		// ※ styled-components の代わりに style タグでスタイルを定義している
		const HamburgerMenu = () => {
			// 開閉状態を管理するステート
			const [isExpanded, setExpanded] = useState(false);
			// 完全に閉じた状態を管理するステート
			const [isHidden, setHidden] = useState(true);

			const handleClick = () => {
				// クリックした直後は開閉いずれの状態であっても hidden 属性の値を false にする
				setHidden(false);
				// クリックしたときに開閉状態を切り替える
				// アニメーションがスムーズに実行されるようにするため、
				// hidden 属性が反映されてから setExpanded する
				setTimeout(() => {
					setExpanded(!isExpanded);
				}, 0);
			};

			const handleTransitionEnd = () => {
				// アニメーションが終了しメニューが閉じたとき（isExpanded が false のとき）、
				// hidden 属性の値を true にする
				!isExpanded && setHidden(true);
			};

			return (
				<div>
					<button
						type="button"
						onClick={handleClick}
						aria-expanded={isExpanded}
						aria-controls="menu"
					>
						<svg role="img" aria-label="メニュー" viewBox="0 0 448 512" width="24" height="24">
							<path d="M0 96C0 78.3 14.3 64 32 64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z" />
						</svg>
					</button>
					<nav
						className={`hamburgermenu${isExpanded ? ' expanded' : ''}`}
						onTransitionEnd={handleTransitionEnd}
						hidden={isHidden}
						id="menu"
						aria-label="メインメニュー"
					>
						<a href="#">ホーム</a>
						<a href="#">商品一覧</a>
						<a href="#">お問い合わせ</a>
					</nav>
				</div>
			);
		};

		ReactDOM.createRoot(document.getElementById('root')).render(<HamburgerMenu />);
	</script>
	<script>
		const source = document.getElementById('app-source').textContent;
		const { code } = Babel.transform(source, {
			presets: [['react', { runtime: 'classic' }], 'typescript'],
			filename: 'app.tsx',
		});
		const script = document.createElement('script');
		script.textContent = code;
		document.body.appendChild(script);
	</script>
</body>
</html>
