<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-3-02: はみ出た画像をdisplay:noneで非表示にする（良い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		ul {
			list-style: none;
			margin: 0;
			padding: 0;
		}

		img {
			width: 160px;
			height: 100px;
			background: #ccc;
			border-radius: 4px;
			display: block;
			object-fit: cover;
		}
	</style>
</head>
<body>
	<h1>5-3-02: はみ出た画像をdisplay:noneで非表示にする（良い例）</h1>

	<!--良い例：はみ出た画像を非表示にする（display:none を使った場合）-->
	<ul>
		<li style="display: none">
			<a href="/page1">
				<img src="https://picsum.photos/id/1015/320/200" alt="断崖の上から見下ろす、山に囲まれた青いフィヨルド">
			</a>
		</li>
		<li style="display: none">
			<a href="/page2">
				<img src="https://picsum.photos/id/1025/320/200" alt="タータンチェックの毛布にくるまれ、森の小道に座るパグ">
			</a>
		</li>
		<li>
			<a href="/page3">
				<!--現在表示されている画像-->
				<img src="https://picsum.photos/id/1035/320/200" alt="虹のかかる滝の前で両手を広げる人">
			</a>
		</li>
		<li style="display: none">
			<a href="/page4">
				<img src="https://picsum.photos/id/1043/320/200" alt="針葉樹と切り立った岩山に囲まれた渓流">
			</a>
		</li>
		<li style="display: none">
			<a href="/page5">
				<img src="https://picsum.photos/id/1050/320/200" alt="海食崖と岩の柱が連なる海岸線">
			</a>
		</li>
	</ul>
</body>
</html>
