<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-1-08: dialog要素を使用したモーダルダイアログ（良い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* 良い例：dialog 要素を使用したモーダルダイアログ（CSS）*/
		.dialog {
			background: #fff;
			color: #111;
			border: 0;
			border-radius: 8px;
			padding: 2rem;
		}

		dialog::backdrop {
			background: rgba(0, 0, 0, .4);
		}
	</style>
</head>
<body>
	<h1>5-1-08: dialog要素を使用したモーダルダイアログ（良い例）</h1>
	<div id="root"></div>

	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

	<script type="text/babel-tsx" id="app-source">
		const { useState, useRef } = React;

		// 良い例：dialog要素を使用すると、フォーカス制御・フォーカストラップ・
		// role指定・モーダルの明示が標準機能として提供される
		const WithDialogElement = () => {
			const [isOpen, setOpen] = useState(false);
			const dialogRef = useRef<HTMLDialogElement | null>(null);

			return (
				<>
					<ul>
						<li>
							<button onClick={() => {
								if (dialogRef.current) {
									// dialog 要素の showModal() を実行することで、
									// モーダルダイアログとしての表示となり、またフォーカスの制御も行われる
									dialogRef.current.showModal();
								}
								setOpen(true);
							}}>
								ダイアログを開く
							</button>
						</li>
						<li>
							<a href="https://gihyo.jp/">技術評論社のWebサイト</a>
						</li>
					</ul>
					<dialog
						className="dialog"
						ref={dialogRef}
						aria-labelledby="dialogTitle"
					>
						<h1 id="dialogTitle">モーダルダイアログ</h1>
						<p>この部分がモーダルダイアログです</p>
						<button onClick={() => {
							if (dialogRef.current) {
								dialogRef.current.close();
							}
							setOpen(false);
						}}>
							ダイアログを閉じる
						</button>
					</dialog>
				</>
			);
		};

		ReactDOM.createRoot(document.getElementById('root')).render(<WithDialogElement />);
	</script>
	<script>
		const source = document.getElementById('app-source').textContent;
		const { code } = Babel.transform(source, {
			presets: [['react', { runtime: 'classic' }], 'typescript'],
			filename: 'app.tsx',
		});
		const script = document.createElement('script');
		script.textContent = code;
		document.body.appendChild(script);
	</script>
</body>
</html>
