<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-8-04: 非インタラクティブなdiv要素とa要素によるナビゲーションの比較</title>
	<link rel="stylesheet" href="style.css">
	<style>
		section {
			margin-bottom: 32px;
			padding-bottom: 16px;
			border-bottom: 1px solid #ccc;
		}

		nav a,
		.nav-link {
			margin-right: 16px;
		}

		.nav-link {
			display: inline-block;
			cursor: pointer;
			color: #06c;
			text-decoration: underline;
		}

		main {
			margin-top: 16px;
		}
	</style>
</head>
<body>
	<h1>5-8-04: 非インタラクティブなdiv要素とa要素によるナビゲーションの比較</h1>

	<section>
		<h2>悪い例：href 属性を持たない div 要素でナビゲーションを実装する</h2>
		<div id="root-bad"></div>
	</section>

	<section>
		<h2>良い例：href 属性を持つ a 要素でナビゲーションを実装する</h2>
		<div id="root-good"></div>
	</section>

	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

	<script type="text/babel-tsx" id="app-source">
		const { useState, useEffect } = React;

		const routes = {
			'/': { title: 'ホーム | サンプルサイト', heading: 'ホーム', body: 'これはトップページのコンテンツです。' },
			'/list': { title: '商品一覧 | サンプルサイト', heading: '商品一覧', body: '商品の一覧を表示するページです。' },
			'/contact': { title: 'お問い合わせ | サンプルサイト', heading: 'お問い合わせ', body: 'お問い合わせフォームのページです。' },
		};

		const Page = ({ path }: { path: string }) => {
			const route = routes[path];
			return (
				<main>
					<h3>{route.heading}</h3>
					<p>{route.body}</p>
				</main>
			);
		};

		// 悪い例：div 要素は非インタラクティブな要素のため、Tab キーでフォーカスが当たらず、
		// リンク先の URL がステータスバーに表示されたり、新しいタブで開いたりすることもできない
		const BadApp = () => {
			const [path, setPath] = useState('/');

			return (
				<>
					<nav aria-label="div要素によるナビゲーション">
						<div className="nav-link" onClick={() => setPath('/')}>ホーム</div>
						<div className="nav-link" onClick={() => setPath('/list')}>商品一覧</div>
						<div className="nav-link" onClick={() => setPath('/contact')}>お問い合わせ</div>
					</nav>
					<Page path={path} />
				</>
			);
		};

		const getPath = () => {
			const hash = location.hash.replace(/^#/, '');
			return routes[hash] ? hash : '/';
		};

		// 良い例：href 属性を持つ a 要素を用いることで、キーボード操作・URLのホバー表示・
		// 新しいタブで開く・URLのコピーといったブラウザ標準の機能をそのまま利用できる
		const GoodApp = () => {
			const [path, setPath] = useState(getPath());

			useEffect(() => {
				const onHashChange = () => setPath(getPath());
				window.addEventListener('hashchange', onHashChange);
				return () => window.removeEventListener('hashchange', onHashChange);
			}, []);

			return (
				<>
					<nav aria-label="a要素によるナビゲーション">
						<a href="#/">ホーム</a>
						<a href="#/list">商品一覧</a>
						<a href="#/contact">お問い合わせ</a>
					</nav>
					<Page path={path} />
				</>
			);
		};

		ReactDOM.createRoot(document.getElementById('root-bad')).render(<BadApp />);
		ReactDOM.createRoot(document.getElementById('root-good')).render(<GoodApp />);
	</script>
	<script>
		const source = document.getElementById('app-source').textContent;
		const { code } = Babel.transform(source, {
			presets: [['react', { runtime: 'classic' }], 'typescript'],
			filename: 'app.tsx',
		});
		const script = document.createElement('script');
		script.textContent = code;
		document.body.appendChild(script);
	</script>
</body>
</html>
