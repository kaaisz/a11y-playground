<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-4-08: アイコンのクリックで表示・非表示を切り替えるツールチップ（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* 改善例: アイコンのクリックにより表示・非表示を切り替えるツールチップ（CSS）*/
		.withTooltip {
			position: relative;
			width: 24px;
			height: 24px;
			display: inline-block;
			vertical-align: middle;
		}

		.button {
			border: 0;
			background: transparent;
			padding: 0;
			cursor: pointer;
		}

		.icon {
			width: 24px;
			height: 24px;
			fill: #767676;
		}

		.tooltip {
			position: absolute;
			bottom: calc(100% + 8px);
			left: -4px;
			border: 1px solid #949494;
			border-radius: 4px;
			padding: 4px;
			width: max-content;
			background: #fff;
			color: #111;
		}

		.tooltip::before,
		.tooltip::after {
			position: absolute;
			content: "";
			border-width: 8px 8px 0;
			border-style: solid;
			width: 0;
			height: 0;
		}

		.tooltip::before {
			bottom: -8px;
			left: 8px;
			border-color: #949494 transparent;
		}

		.tooltip::after {
			bottom: -7px;
			left: 8px;
			border-color: #fff transparent;
		}
	</style>
</head>
<body>
	<h1>5-4-08: アイコンのクリックで表示・非表示を切り替えるツールチップ（改善例）</h1>
	<div id="root"></div>

	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

	<script type="text/babel-tsx" id="app-source">
		const { useEffect, useRef, useState } = React;

		// （改善例：アイコンのクリックにより表示・非表示を切り替えるツールチップ（TypeScript）
		// ※ react-icons の MdHelp の代わりに、同等のクエスチョンマークアイコンをインラインSVGで用意している
		const HelpIcon = () => {
			// ツールチップの表示状態を保持する state
			const [isTooltipVisible, setTooltipVisible] = useState(false);
			// setTimeout の戻り値を保持するための RefObject
			const timeoutId = useRef<ReturnType<typeof setTimeout> | null>(null);

			// 1秒後に isTooltipVisible を切り替えるメソッド
			const changeVisibility = (visible: boolean, immediate: boolean = false) => {
				if (timeoutId.current) {
					// 事前に予定されているフラグ切り替えをキャンセル
					clearTimeout(timeoutId.current);
					timeoutId.current = null;
				}
				if (immediate) {
					setTooltipVisible(visible);
				} else {
					timeoutId.current = setTimeout(() => {
						setTooltipVisible(visible);
					}, 1000);
				}
			};

			useEffect(() => {
				if (isTooltipVisible) {
					// ツールチップ外のクリックで、ツールチップを即時に閉じる
					const close = () => {
						changeVisibility(false, true);
					};
					// Esc キー押下でもツールチップを閉じる
					const escKeyHandler = (e: KeyboardEvent) => {
						if (e.key === 'Escape') {
							changeVisibility(false, true);
						}
					};
					window.addEventListener('click', close);
					window.addEventListener('keydown', escKeyHandler);

					return () => {
						window.removeEventListener('click', close);
						window.removeEventListener('keydown', escKeyHandler);
					};
				}
			}, [isTooltipVisible]);

			return (
				<>
					<a href="https://gihyo.jp/">
						技術評論社のWebサイト
					</a>

					{/* window に click イベントが伝播しないようにする */}
					<span className="withTooltip" onClick={(e) => e.stopPropagation()}>
						<button
							type="button"
							className="button"
							onMouseEnter={() => changeVisibility(true)}
							onMouseLeave={() => changeVisibility(false)}
							onClick={() => changeVisibility(!isTooltipVisible, true)}
							aria-label="ヘルプ"
							aria-haspopup="true"
							aria-expanded={isTooltipVisible}
							aria-controls="tooltip"
						>
							<svg className="icon" viewBox="0 0 512 512" aria-hidden="true">
								<path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM169.8 165.3c7.9-22.3 29.1-37.3 52.8-37.3h58.3c34.9 0 63.1 28.3 63.1 63.1c0 22.6-12.1 43.5-31.7 54.8L280 264.4c-.2 13-10.9 23.6-24 23.6c-13.3 0-24-10.7-24-24V250.5c0-8.6 4.6-16.5 12.1-20.8l44.3-25.4c4.7-2.7 7.6-7.7 7.6-13.1c0-8.4-6.8-15.1-15.1-15.1H222.6c-3.4 0-6.4 2.1-7.5 5.3l-.4 1.2c-4.4 12.5-18.2 19-30.6 14.6s-19-18.2-14.6-30.6l.4-1.2zM224 352a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z"/>
							</svg>
						</button>
						{isTooltipVisible &&
							<span
								id="tooltip"
								className="tooltip"
								onMouseEnter={() => changeVisibility(true)}
								onMouseLeave={() => changeVisibility(false)}
								tabIndex={-1}
							>
								この本を出版している会社のWebサイト
							</span>
						}
					</span>
				</>
			);
		};

		ReactDOM.createRoot(document.getElementById('root')).render(<HelpIcon />);
	</script>
	<script>
		const source = document.getElementById('app-source').textContent;
		const { code } = Babel.transform(source, {
			presets: [['react', { runtime: 'classic' }], 'typescript'],
			filename: 'app.tsx',
		});
		const script = document.createElement('script');
		script.textContent = code;
		document.body.appendChild(script);
	</script>
</body>
</html>
