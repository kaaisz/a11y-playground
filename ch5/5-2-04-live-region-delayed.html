<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>5-2-04: メッセージを遅延して挿入する（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		.notification {
			margin-top: 12px;
			padding: 8px 12px;
			background: #eef;
			color: #111;
			border-radius: 4px;
			display: inline-block;
			min-height: 1em;
		}
	</style>
</head>
<body>
	<h1>5-2-04: メッセージを遅延して挿入する（改善例）</h1>
	<div id="root"></div>

	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

	<script type="text/babel-tsx" id="app-source">
		const { useState, useEffect } = React;

		// 改善例：メッセージを遅延して、aria-live 属性を指定した要素に挿入するコンポーネント
		const Notification = ({ message }: { message: string }) => {
			const [delayedMessage, setDelayedMessage] = useState('');

			useEffect(() => {
				// コンポーネントがマウントされたときの処理
				// 100ミリ秒遅れて、delayedMessage に message の内容をセットし、
				// aria-live 属性を指定した要素に挿入する
				const timer = setTimeout(() => {
					setDelayedMessage(message);
				}, 100);
				return () => clearTimeout(timer);
			}, []);

			return (
				<div className="notification" aria-live="polite" aria-atomic="true">
					{delayedMessage}
				</div>
			);
		};

		const App = () => {
			const [processHasDone, setProcessHasDone] = useState(false);

			return (
				<>
					<button onClick={() => setProcessHasDone(true)}>処理を実行</button>
					{processHasDone && <Notification message="処理が完了しました" />}
				</>
			);
		};

		ReactDOM.createRoot(document.getElementById('root')).render(<App />);
	</script>
	<script>
		const source = document.getElementById('app-source').textContent;
		const { code } = Babel.transform(source, {
			presets: [['react', { runtime: 'classic' }], 'typescript'],
			filename: 'app.tsx',
		});
		const script = document.createElement('script');
		script.textContent = code;
		document.body.appendChild(script);
	</script>
</body>
</html>
