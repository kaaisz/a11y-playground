<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3-3-01: エラーが適切にマークアップされていない（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		label {
			display: block;
			font-weight: bold;
		}

		.error {
			display: block;
			color: #c00;
			font-weight: normal;
		}

		input {
			display: block;
			padding: 8px;
			width: 260px;
			margin-top: 4px;
		}
	</style>
</head>
<body>
	<h1>3-3-01: エラーが適切にマークアップされていない（悪い例）</h1>

	<!--悪い例：エラーが適切にマークアップされていないフォームコントロール-->
	<label for="username">
		<span>ユーザー名（半角英数字で入力）</span>
	</label>
	<span class="error">エラー：すでに同じユーザー名が登録されています。</span>
	<input type="text" id="username">
</body>
</html>
