<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3-2-12: 選択項目が少ない場合はラジオボタン・チェックボックスを使う（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		fieldset {
			max-width: 320px;
			margin-bottom: 0;
		}

		fieldset label {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-top: 4px;
		}
	</style>
</head>
<body>
	<h1>3-2-12: 選択項目が少ない場合はラジオボタン・チェックボックスを使う（改善例）</h1>

	<!--良い例：選択肢が4つしかないので、ラジオボタンを利用する-->
	<fieldset>
		<legend>商品の色（どれか1つを選択）</legend>
		<label><input type="radio" name="product-color"> 青</label>
		<label><input type="radio" name="product-color"> 緑</label>
		<label><input type="radio" name="product-color"> 黄</label>
		<label><input type="radio" name="product-color"> 赤</label>
	</fieldset>
</body>
</html>
