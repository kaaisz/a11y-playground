<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3-4-01: フォームコントロールの値を変更したときに画面遷移が発生する（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		select {
			padding: 8px;
		}

		.status {
			margin-top: 16px;
			color: #06c;
		}
	</style>
</head>
<body>
	<h1>3-4-01: フォームコントロールの値を変更したときに画面遷移が発生する（悪い例）</h1>

	<!--悪い例：セレクトボックスの値を変更した瞬間に画面遷移（相当の処理）が発生してしまう
		矢印キーで選択肢を切り替えただけでも change イベントが発生するブラウザがある-->
	<label for="lang">言語切り替え</label>
	<select id="lang" onchange="document.getElementById('status').textContent = this.value + ' に切り替わりました（画面遷移が発生した想定）'">
		<option value="日本語" selected>日本語</option>
		<option value="English">English</option>
		<option value="中文">中文</option>
		<option value="한국어">한국어</option>
	</select>

	<p class="status" id="status"></p>
</body>
</html>
