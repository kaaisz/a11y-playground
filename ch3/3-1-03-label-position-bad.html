<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3-1-03: ラベルと説明の配置がわかりづらい（悪い例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		section {
			margin-bottom: 32px;
		}

		label {
			display: block;
			margin-bottom: 4px;
			font-weight: bold;
		}

		input[type="text"] {
			padding: 8px;
			width: 260px;
			display: block;
		}

		.description {
			color: #666;
			font-size: 0.9rem;
		}

		/* 悪い例：チェックボックスが横に並べられ、かつ接近している */
		.checkbox-row {
			display: flex;
			flex-wrap: wrap;
		}

		.checkbox-row label {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			font-weight: normal;
			margin-right: 8px;
		}
	</style>
</head>
<body>
	<h1>3-1-03: ラベルと説明の配置がわかりづらい（悪い例）</h1>

	<section>
		<h2>悪い例：説明がテキストコントロールのあとに配置されている</h2>
		<!--悪い例：説明がテキストコントロールのあとに配置されている-->
		<label for="password">パスワード</label>
		<input type="text" id="password">
		<span class="description">8文字以上、英数字と記号を組み合わせて入力してください</span>
	</section>

	<section>
		<h2>悪い例：チェックボックスが横に並べられ、かつ接近している</h2>
		<!--悪い例：項目数の多いチェックボックスが横に並べられ、かつ接近している-->
		<span>興味のあるトピック（3つまで選択）</span>
		<div class="checkbox-row">
			<label><input type="checkbox" name="topic"> 政治</label>
			<label><input type="checkbox" name="topic"> 経済</label>
			<label><input type="checkbox" name="topic"> 国際</label>
			<label><input type="checkbox" name="topic"> 科学</label>
			<label><input type="checkbox" name="topic"> スポーツ</label>
		</div>
	</section>
</body>
</html>
