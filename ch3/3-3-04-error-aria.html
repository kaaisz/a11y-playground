<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3-3-04: WAI-ARIAを使ってフォームコントロールのエラーをマークアップする（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		#username-label {
			display: block;
			font-weight: bold;
		}

		#username-description {
			display: block;
			color: #666;
			font-size: 0.9rem;
		}

		#username-error {
			display: block;
			color: #c00;
		}

		input {
			display: block;
			padding: 8px;
			width: 260px;
			margin-top: 4px;
		}

		input[aria-invalid="true"] {
			border: 2px dotted #c00;
		}
	</style>
</head>
<body>
	<h1>3-3-04: WAI-ARIAを使ってフォームコントロールのエラーをマークアップする（改善例）</h1>

	<!--改善例：WAI-ARIA を使ってフォームコントロールのエラーをマークアップする-->
	<span id="username-label">ユーザー名</span>
	<span id="username-description">（半角英数字で入力）</span>
	<span id="username-error">エラー：すでに同じユーザー名が登録されています。</span>
	<input
		type="text"
		aria-invalid="true"
		aria-labelledby="username-label"
		aria-describedby="username-description username-error"
	>
</body>
</html>
