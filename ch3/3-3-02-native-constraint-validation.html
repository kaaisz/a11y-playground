<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3-3-02: HTML標準の制約検証を利用する（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		form {
			display: flex;
			flex-direction: column;
			gap: 12px;
			max-width: 320px;
		}

		label {
			display: flex;
			flex-direction: column;
			gap: 4px;
			font-weight: bold;
		}

		input {
			padding: 8px;
			font-weight: normal;
		}

		/* 良い例：数値入力で値が不正なときに枠線のスタイルを変更する */
		input:valid {
			border: 1px solid #767676;
		}

		input:invalid {
			border: 2px dotted #c00;
		}
	</style>
</head>
<body>
	<h1>3-3-02: HTML標準の制約検証を利用する（改善例）</h1>

	<!--改善例：required 属性・type="email" などの HTML 標準の制約検証を利用する-->
	<form>
		<label>ユーザー名（必須・半角英数字4〜16文字）
			<input type="text" required pattern="[a-zA-Z0-9]{4,16}">
		</label>
		<label>メールアドレス（必須）
			<input type="email" required>
		</label>
		<button type="submit">送信</button>
	</form>
</body>
</html>
