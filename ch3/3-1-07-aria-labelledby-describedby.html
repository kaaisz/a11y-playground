<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3-1-07: WAI-ARIAを使ってフォームコントロールにラベルと説明を関連付ける（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		#username-label {
			display: block;
			font-weight: bold;
		}

		#username-description {
			display: block;
			margin-top: 4px;
			color: #666;
			font-size: 0.9rem;
		}

		input {
			display: block;
			padding: 8px;
			width: 260px;
			margin-top: 4px;
		}
	</style>
</head>
<body>
	<h1>3-1-07: WAI-ARIAを使ってフォームコントロールにラベルと説明を関連付ける（改善例）</h1>

	<!--改善例：WAI-ARIA を使ってフォームコントロールにラベルと説明を関連付ける-->
	<span id="username-label">ユーザー名</span>
	<span id="username-description">（半角英数字で入力）</span>
	<input
		type="text"
		aria-labelledby="username-label"
		aria-describedby="username-description"
	>
</body>
</html>
