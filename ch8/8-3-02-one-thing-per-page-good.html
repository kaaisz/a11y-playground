<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>8-3-02: 1画面1フォームに分割する（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		main {
			max-width: 360px;
		}

		.step-label {
			color: #666;
			font-size: 0.9rem;
			margin-bottom: 4px;
		}

		label {
			display: block;
			margin-bottom: 8px;
		}

		input {
			padding: 6px;
			width: 100%;
			box-sizing: border-box;
		}

		button {
			margin-top: 8px;
			padding: 6px 16px;
		}
	</style>
</head>
<body>
	<h1>8-3-02: 1画面1フォームに分割する（改善例）</h1>

	<!--改善例：各ステップを独立した画面（ここでは location.hash による疑似ページ）にする
		常に1画面には1つのフォームしかないため状態把握が不要になり、
		ブラウザの「戻る」ナビゲーションもそのまま使える-->
	<main id="app"></main>

	<script>
		const steps = {
			'/shipping': {
				label: 'ステップ 1 / 3',
				title: '配送先',
				fields: ['郵便番号', '住所'],
				next: '/option',
			},
			'/option': {
				label: 'ステップ 2 / 3',
				title: '配送オプション',
				fields: ['お届け希望日'],
				next: '/payment',
			},
			'/payment': {
				label: 'ステップ 3 / 3',
				title: '支払い情報',
				fields: ['カード番号'],
				next: null,
			},
		};

		const getPath = () => {
			const hash = location.hash.replace(/^#/, '');
			return steps[hash] ? hash : '/shipping';
		};

		const render = () => {
			const path = getPath();
			const step = steps[path];
			const app = document.getElementById('app');
			app.innerHTML = '';

			const stepLabel = document.createElement('p');
			stepLabel.className = 'step-label';
			stepLabel.textContent = step.label;
			app.appendChild(stepLabel);

			const heading = document.createElement('h2');
			heading.textContent = step.title;
			app.appendChild(heading);

			step.fields.forEach((field) => {
				const label = document.createElement('label');
				label.textContent = field;
				const input = document.createElement('input');
				input.type = 'text';
				label.appendChild(input);
				app.appendChild(label);
			});

			const button = document.createElement('button');
			button.type = 'button';
			button.textContent = step.next ? '次へ' : '注文を確定する';
			button.addEventListener('click', () => {
				if (step.next) {
					location.hash = step.next;
				}
			});
			app.appendChild(button);
		};

		window.addEventListener('hashchange', render);
		render();
	</script>
</body>
</html>
