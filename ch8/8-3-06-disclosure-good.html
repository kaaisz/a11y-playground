<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>8-3-06: ディスクロージャーで情報を表示する（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		details {
			max-width: 320px;
			border: 1px solid #767676;
			border-radius: 4px;
			padding: 8px 16px;
		}

		summary {
			cursor: pointer;
			font-weight: bold;
			padding: 4px 0;
		}
	</style>
</head>
<body>
	<h1>8-3-06: ディスクロージャーで情報を表示する（改善例）</h1>

	<!--改善例：モードを必要としない補足情報は、summary要素・details要素による
		ディスクロージャーでインラインに表示する。ほかの操作を妨げず、
		視界も占有しない-->
	<details>
		<summary>送料について</summary>
		<p>3,000円以上のご購入で送料が無料になります。北海道・沖縄・離島は別途送料がかかります。</p>
	</details>
</body>
</html>
