<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>8-6-06: 新規タブは既定にせず、必要な場合は明示する（改善例）</title>
	<link rel="stylesheet" href="style.css">
	<style>
		svg {
			width: 0.8em;
			height: 0.8em;
			vertical-align: middle;
		}
	</style>
</head>
<body>
	<h1>8-6-06: 新規タブは既定にせず、必要な場合は明示する（改善例）</h1>

	<!--改善例：既定では同じタブで遷移し、「新規タブで開く」かどうかの選択権をユーザーに委ねる-->
	<p>
		ご利用にあたっては<a href="#" id="terms">利用規約</a>をご確認ください。
	</p>

	<!--改善例：外部サイトなどでどうしても新規タブが必要な場合は、
		アイコンとテキストで新規タブが開くことを明示する。rel="noopener" も付ける-->
	<p>
		決済処理は外部の決済代行サービスで行われます。
		<a href="#" target="_blank" rel="noopener noreferrer" id="external">
			決済ページへ進む
			<svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M14 3v2h3.59L9 13.59 10.41 15 19 6.41V10h2V3h-7zM5 5h5V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5h-2v5H5V5z"/></svg>
			<span>（新しいタブで開く）</span>
		</a>
	</p>

	<p id="readout"></p>
	<script>
		document.getElementById('readout').textContent =
			`「利用規約」の target 属性：${document.getElementById('terms').target || '(なし・同じタブで開く)'}`;
	</script>
</body>
</html>
